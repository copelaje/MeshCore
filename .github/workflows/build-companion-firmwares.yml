# NOTE: This file lives on the `csra-test-builds` branch only. It builds CSRA
# (Companion Selective Repeat Ability) test firmware with the feature HARD-ENABLED
# via -DCSRA_FORCE_SELECTIVE=1. Do not merge this branch upstream -- the clean
# feature lives on `feature/companion-selective-repeat`.
name: Build Companion Firmwares (CSRA forced-on)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'companion-*'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmwares
        env:
          FIRMWARE_VERSION: ${{ env.GIT_TAG_VERSION }}
          # Hard-enable Companion Selective Repeat. build.sh appends to this var and
          # PlatformIO applies it to every env, so the flag reaches all companion targets.
          PLATFORMIO_BUILD_FLAGS: -DCSRA_FORCE_SELECTIVE=1
          # Release-style build (no debug logging), matching build-csra.sh.
          DISABLE_DEBUG: "1"
        run: /usr/bin/env bash build.sh build-companion-firmwares

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: companion-firmwares
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Companion Firmware ${{ env.GIT_TAG_VERSION }} (CSRA forced-on)
          body: "Experimental build with Companion Selective Repeat hard-enabled (CSRA_FORCE_SELECTIVE). For testing only."
          draft: true
          files: out/*